name: iOS IPA (CarPlay)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_NAME: Kumone
  VERSION: 0.3.0-carplay

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Dump CPListItem SDK interface (debug)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          ls "$SDK/System/Library/Frameworks/" | grep -i carplay
          find "$SDK/System/Library/Frameworks/CarPlay.framework" -name "*.swiftinterface" | head -5
          HDR=$(find "$SDK/System/Library/Frameworks/CarPlay.framework" -name "CPListItem.h" | head -1)
          echo "HDR=$HDR"
          grep -n -B2 -A6 "handler" "$HDR" | head -50
          grep -n -B2 -A4 "initWithText" "$HDR" | head -60

      - name: Build unsigned iOS IPA (CarPlay enabled)
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="1" \
            build

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/$APP_NAME"IOS.app
          echo "=== 验证产物 Info.plist 中的 CarPlay 场景配置 ==="
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$APP/Info.plist"

          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry "$GITHUB_WORKSPACE/$APP_NAME-iOS-$VERSION-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE"

      - name: Upload unsigned IPA + entitlements
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-iOS-carplay-unsigned
          path: |
            Kumone-iOS-0.3.0-carplay-unsigned.ipa
            CarPlay.entitlements
          if-no-files-found: error
